# Dependency updates, grouped so each ecosystem opens at most one pull request a month.
# Security updates are separate: Dependabot opens those as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
