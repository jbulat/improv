[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; Resident headers use std::optional (C++17); arduino-espressif32 6.12
; defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; Every URL dependency is pinned to a commit: a floating one changes what
    ; gets flashed with no compile error and no log. To co-develop Resident
    ; locally, swap this line for symlink://../../resident, but never commit
    ; that: the firmware then builds on one machine only.
    git+https://github.com/inanimate-tech/resident.git#cf29120a18bfc0c5bf9c3b328eda9a8c0ae0b5a3  ; v0.8.3
    ; PIO quirk (see the m5stick-demo ini): a symlinked parent suppresses
    ; auto-scan of our own lib/, so re-add it explicitly.
    symlink://lib/drivers
    ; Courier's inbound dispatch depends on Config::defaultTransport (see
    ; main.cpp); a change there drops every message with no compile error or log.
    git+https://github.com/inanimate-tech/courier.git#281d6debd0bf3bd84bfb9c4856f318fc84bf4de5  ; v0.8.0
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.4.3
    ropg/ezTime@0.8.3
    fischer-simon/Esp32Lua@5.4.7
    ; Exact versions, as built and run on the hardware. M5GFX is M5Unified's
    ; own dependency, pinned here so it cannot float either. It comes from git
    ; because the registry does not serve 0.2.25, and it is listed first so
    ; M5Unified's ">=0.2.25" is already met when it resolves.
    M5GFX=https://github.com/m5stack/M5GFX.git#ad9b814264d4e2000e9f30070002310bbccaffc9  ; 0.2.25
    m5stack/M5Unified@0.2.18
    M5PM1=https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee  ; 1.0.7
